services:
  db:
    image: pgvector/pgvector:pg16
    container_name: worldvision_ai_db
    environment:
      POSTGRES_DB: worldvision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - worldvision_pgdata:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: worldvision_ai_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

volumes:
  worldvision_pgdata: